    <script>
        const galleryImages = document.querySelectorAll('.column img');

        galleryImages.forEach(image => {
            const decodeImage = () => {
                if (image.naturalWidth === 0 || typeof image.decode !== 'function') {
                    image.classList.add('is-loaded');
                    return;
                }

                image.decode()
                    .then(() => image.classList.add('is-loaded'))
                    .catch(error => {
                        console.error(`Unable to decode photography image: ${image.currentSrc || image.src}`, error);
                        if (image.complete && image.naturalWidth > 0) {
                            image.classList.add('is-loaded');
                        }
                    });
            };

            image.addEventListener('load', decodeImage, { once: true });
            image.addEventListener('error', () => image.classList.add('is-loaded'), { once: true });
            if (image.complete && image.naturalWidth > 0) {
                decodeImage();
            }
        });

        const pendingPhotos = new Set(galleryImages);
        let photoRevealFrame = 0;

        function revealVisiblePhotos() {
            photoRevealFrame = 0;

            pendingPhotos.forEach(image => {
                const bounds = image.getBoundingClientRect();
                if (bounds.top < window.innerHeight + 120 && bounds.bottom > -120) {
                    image.classList.add('is-in-view');
                    pendingPhotos.delete(image);
                }
            });

            if (!pendingPhotos.size) {
                window.removeEventListener('scroll', schedulePhotoReveal);
                window.removeEventListener('resize', schedulePhotoReveal);
            }
        }

        function schedulePhotoReveal() {
            if (!photoRevealFrame) {
                photoRevealFrame = window.requestAnimationFrame(revealVisiblePhotos);
            }
        }

        window.addEventListener('scroll', schedulePhotoReveal, { passive: true });
        window.addEventListener('resize', schedulePhotoReveal);
        revealVisiblePhotos();
    </script>

    <script>
        const photos = [
            'assets/photo1.jpg',
            'assets/photo1.5.jpg',
            'assets/photo2.jpg',
            'assets/photo2.5.jpg',
            'assets/photo3.jpg',
            'assets/photo3.5.jpg',
            'assets/photo4.jpg',
            'assets/photo5.jpg',
            'assets/photo6.jpg',
            'assets/photo6.5.jpg',
            'assets/photo7.jpg',
            'assets/photo7.5.jpg',
            'assets/photo7.6.jpg',
            'assets/photo8.jpg',
            'assets/photo8.5.jpg',
            'assets/photo9.jpg',
            'assets/photo9.5.jpg',
            'assets/photo10.jpg',
            'assets/photo10.5.jpg',
            'assets/photo11.jpg',
            'assets/photo11.5.jpg'
        ];

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            document.getElementById('lightbox').classList.add('active');
            document.getElementById('lightbox-img').src = photos[currentIndex];
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (event.target.id === 'lightbox' || event.target.className === 'close') {
                document.getElementById('lightbox').classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        function changePhoto(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = photos.length - 1;
            } else if (currentIndex >= photos.length) {
                currentIndex = 0;
            }
            document.getElementById('lightbox-img').src = photos[currentIndex];
        }

        // Keyboard navigation
        document.addEventListener('keydown', function (e) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox && lightbox.classList.contains('active')) {
                if (e.key === 'ArrowLeft') {
                    changePhoto(-1);
                } else if (e.key === 'ArrowRight') {
                    changePhoto(1);
                } else if (e.key === 'Escape') {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            }
        });
    </script>
